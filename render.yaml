# Render Blueprint: Film Director AI on the FREE plan (no card, no paid database).
# The app runs its own database inside the container. On the free plan the container disk is temporary, so data is
# lost when the service restarts. For permanent data at no cost, create a free Postgres at neon.tech and paste its
# connection string into FDA_DATABASE_URL (Environment tab); videos are then stored in that database too.
services:
  - type: web
    name: film-director-ai
    runtime: docker
    plan: free
    dockerContext: ./film-director-ai
    dockerfilePath: ./film-director-ai/infra/docker/backend.Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: FDA_ENV
        value: production
      - key: FDA_USE_CELERY
        value: "false"
      - key: FDA_STORAGE_BACKEND
        value: db
      - key: FDA_STORAGE_DIR
        value: /tmp/storage
      - key: FDA_PG_DIR
        value: /tmp/pg
      - key: FDA_DATABASE_URL
        sync: false
      - key: FDA_SECRET_KEY
        generateValue: true
      - key: FDA_OWNER_PASSWORD
        generateValue: true

# Render Blueprint: one-click deploy of Film Director AI (website + API in one service).
# Files are stored in the database (FDA_STORAGE_BACKEND=db), so restarts do not delete videos.
# Free plan: the service sleeps when idle; Render's free database expires after 30 days.
databases:
  - name: fda-db
    plan: free
    databaseName: fda
    postgresMajorVersion: "16"

services:
  - type: web
    name: film-director-ai
    runtime: docker
    plan: free
    dockerContext: ./film-director-ai
    dockerfilePath: ./film-director-ai/infra/docker/backend.Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: FDA_ENV
        value: production
      - key: FDA_USE_CELERY
        value: "false"
      - key: FDA_STORAGE_BACKEND
        value: db
      - key: FDA_STORAGE_DIR
        value: /tmp/storage
      - key: FDA_DATABASE_URL
        fromDatabase: { name: fda-db, property: connectionString }
      - key: FDA_SECRET_KEY
        generateValue: true
      - key: FDA_OWNER_PASSWORD
        generateValue: true

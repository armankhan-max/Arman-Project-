# Development stack: docker compose up --build   →  http://localhost:3000
services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: fda }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
  backend:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    env_file: .env
    environment:
      FDA_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/fda
      FDA_REDIS_URL: redis://redis:6379/0
      FDA_STORAGE_DIR: /data/storage
      FDA_CORS_ORIGINS: http://localhost:3000
    volumes: [storage:/data/storage]
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  worker:   # research, transcription, visuals, audio, QC
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    env_file: .env
    environment: { FDA_DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/fda", FDA_REDIS_URL: "redis://redis:6379/0", FDA_STORAGE_DIR: /data/storage }
    volumes: [storage:/data/storage]
    command: celery -A fda.workers.celery_app worker -Q default,research,transcription,visual,audio,qc -c 4 --loglevel=info
    depends_on: [backend]
  render-worker:   # CPU-heavy: frame rendering and Blender, one job at a time
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    env_file: .env
    environment: { FDA_DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/fda", FDA_REDIS_URL: "redis://redis:6379/0", FDA_STORAGE_DIR: /data/storage }
    volumes: [storage:/data/storage]
    command: celery -A fda.workers.celery_app worker -Q render,blender -c 1 --loglevel=info
    depends_on: [backend]
  beat:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    env_file: .env
    environment: { FDA_DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/fda", FDA_REDIS_URL: "redis://redis:6379/0" }
    command: celery -A fda.workers.celery_app beat --loglevel=info
    depends_on: [backend]
  frontend:
    build: { context: ., dockerfile: infra/docker/frontend.Dockerfile }
    ports: ["3000:3000"]
    depends_on: [backend]
volumes: { pgdata: {}, storage: {} }
